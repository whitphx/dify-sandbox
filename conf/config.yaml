app:
  port: 8194
  debug: True
  key: dify-sandbox
max_workers: 4
max_requests: 50
worker_timeout: 5
python_path: /usr/bin/python3
enable_network: True # please make sure there is no network risk in your environment
enable_preload: False # please keep it as False for security purposes
storage_path: "/tmp/dify_sandbox_data"
allowed_syscalls:
  # XXX: allow all syscalls, ref https://qiita.com/yushibats/items/c8f5ae1b2818665f1b3e#2-configyaml-%E3%81%AE-syscall-%E8%A8%B1%E5%8F%AF%E3%83%AA%E3%82%B9%E3%83%88%E3%82%92%E6%8B%A1%E5%BC%B5
  []
proxy:
  socks5: ''
  http: ''
  https: ''
